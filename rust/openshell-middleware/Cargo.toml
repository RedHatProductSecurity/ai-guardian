[package]
name = "ai-guardian-openshell-middleware"
version = "1.20.0-dev"
edition = "2021"
license = "Apache-2.0"
description = "Rust OpenShell supervisor middleware backed by the AI Guardian daemon"

[[bin]]
name = "ai-guardian-openshell-middleware"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
