name: Prepare real-agent CLI smoke
description: Build and install the current wheel, optionally building the existing support image recipe

inputs:
  image:
    description: Local support image tag; leave empty when the caller builds its own image
    required: false
    default: ''
  opencode-version:
    description: Optional exact OpenCode pin for this disposable smoke image only
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Build AI Guardian wheel
      shell: bash
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel
        mkdir -p container/vendor
        cp dist/*.whl container/vendor/
        WHEEL=$(basename container/vendor/ai_guardian-*.whl)
        echo "WHEEL=${WHEEL}" >> "$GITHUB_ENV"

    - name: Install current wheel for sandbox lifecycle
      shell: bash
      run: python -m pip install dist/*.whl

    - name: Build normal support image
      if: ${{ inputs.image != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SMOKE_IMAGE: ${{ inputs.image }}
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
      run: |
        extra_build_args=()
        if [ -n "$OPENCODE_VERSION" ]; then
          extra_build_args+=(--build-arg "OPENCODE_VERSION=$OPENCODE_VERSION")
        fi
        docker build \
          --secret id=github_token,env=GITHUB_TOKEN \
          --build-arg AI_GUARDIAN_VERSION="$WHEEL" \
          "${extra_build_args[@]}" \
          -t "$SMOKE_IMAGE" \
          container/
