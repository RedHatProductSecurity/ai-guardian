# GitHub Actions CI/CD - Publish Workflow
# Routes to PyPI or TestPyPI based on tag format:
#   v1.2.3        → PyPI (production) + GitHub Release
#   v1.2.3-test1  → TestPyPI only

name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_openshell_middleware:
    name: Build OpenShell middleware (${{ matrix.target }})
    # Test tags publish only to TestPyPI and do not create a GitHub release.
    # Build the release assets only for a production version tag.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Verify release and middleware versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          python3 scripts/sync_rust_middleware_version.py \
            --repo . \
            --version "$VERSION" \
            --check
          python3 scripts/check_openshell_compatibility.py

      - name: Run Rust middleware tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --manifest-path rust/openshell-middleware/Cargo.toml

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          fi
          cargo build --locked --release --target "$TARGET" \
            --manifest-path rust/openshell-middleware/Cargo.toml

          BINARY="rust/openshell-middleware/target/${TARGET}/release/ai-guardian-openshell-middleware"
          test -x "$BINARY"
          file "$BINARY"

      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          ASSET="ai-guardian-openshell-middleware-${VERSION}-${TARGET}"
          BINARY="rust/openshell-middleware/target/${TARGET}/release/ai-guardian-openshell-middleware"

          mkdir -p "dist/${ASSET}"
          install -m 0755 "$BINARY" "dist/${ASSET}/ai-guardian-openshell-middleware"
          cp rust/openshell-middleware/README.md LICENSE "dist/${ASSET}/"
          tar -C dist -czf "dist/${ASSET}.tar.gz" "$ASSET"
          rm -rf "dist/${ASSET}"
          tar -tzf "dist/${ASSET}.tar.gz"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: openshell-middleware-${{ matrix.target }}
          path: dist/ai-guardian-openshell-middleware-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Build and Publish
    runs-on: ubuntu-26.04
    needs: build_openshell_middleware
    # A skipped binary job is expected for TestPyPI tags and manual runs. A
    # failed production binary build must prevent package/release publication.
    if: >-
      always() &&
      (needs.build_openshell_middleware.result == 'success' ||
      needs.build_openshell_middleware.result == 'skipped')
    environment: ${{ contains(github.ref, '-test') && 'testpypi' || 'production' }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Detect target
        id: target
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-test* ]]; then
            echo "registry=testpypi" >> "$GITHUB_OUTPUT"
            echo "repository_url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "🧪 Test tag detected: $TAG → TestPyPI"
          else
            echo "registry=pypi" >> "$GITHUB_OUTPUT"
            echo "repository_url=" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "📦 Production tag detected: $TAG → PyPI"
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Check distribution packages
        run: |
          twine check dist/*
          ls -la dist/

      - name: Download OpenShell middleware release assets
        if: steps.target.outputs.create_release == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: openshell-middleware-*
          path: dist
          merge-multiple: true

      - name: Publish to ${{ steps.target.outputs.registry }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ steps.target.outputs.repository_url || '' }}
          skip-existing: true
          verbose: true
          print-hash: true

      - name: Generate checksums
        if: steps.target.outputs.create_release == 'true'
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG
        if: steps.target.outputs.create_release == 'true'
        id: extract-release-notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          awk -v ver="$VERSION" '
            /^## \['"$VERSION"'\]/ { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        if: steps.target.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
