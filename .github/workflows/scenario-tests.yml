# CI: Dummy-Agent Scenario Tests
#
# Builds the container image locally and runs all bundled scenarios
# for each profile to catch regressions in hook processing before merge.
#
# No registry or secrets required — the base image is built from source
# so fork PRs get full scenario coverage (#2135).
#
# Profiles tested: standard, strict, minimal
# Moderator profile is excluded — action=ask auto-dismisses in headless CI,
# making those scenarios untestable without dialog mocking (see #1501).

name: Scenario Tests

on:
  push:
    branches: ['dev/*']
    paths:
      - 'container/**'
      - 'src/ai_guardian/**'
      - '.github/workflows/scenario-tests.yml'
  pull_request:
    branches:
      - main
      - 'dev/*'
      - 'release-*'
    paths:
      - 'container/**'
      - 'src/ai_guardian/**'
      - '.github/workflows/scenario-tests.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  scenario-tests:
    name: Scenario Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [standard, strict, minimal]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
          mkdir -p container/vendor/
          cp dist/*.whl container/vendor/

      - name: Build base image locally
        run: |
          WHL=$(ls container/vendor/ai_guardian-*.whl | xargs basename)
          docker build \
            --build-arg AI_GUARDIAN_VERSION="$WHL" \
            -t ai-guardian-base \
            container/

      - name: Build test image
        run: |
          docker build \
            -f container/Dockerfile.test \
            --build-arg BASE_IMAGE=ai-guardian-base \
            -t ai-guardian-test \
            .

      - name: Run doctor smoke-test
        run: |
          docker run --rm \
            -e AI_GUARDIAN_PROFILE=${{ matrix.profile }} \
            ai-guardian-test \
            ai-guardian doctor --smoke-test

      - name: Run ${{ matrix.profile }} scenarios
        run: docker run --rm -e AI_GUARDIAN_PROFILE=${{ matrix.profile }} ai-guardian-test /sandbox/run-scenarios.sh
