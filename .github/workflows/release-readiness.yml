name: Release Readiness
run-name: ${{ github.workflow }}${{ github.event.inputs.release_attempt_id && format(' [release-attempt:{0}]', github.event.inputs.release_attempt_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      release_attempt_id:
        description: Unique release CI attempt identifier; leave blank for manual runs
        required: false
        type: string
        default: ''
  push:
    branches:
      - 'release-*'

jobs:
  fresh-install:
    name: Fresh Install, CLI, Config & Pattern Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from source
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify version
        run: ai-guardian --version

      - name: Verify supported Python metadata
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          assert sys.version_info >= (3, 10)
          metadata = importlib.metadata.metadata("ai-guardian")
          assert metadata["Requires-Python"] == ">=3.10"
          assert "Programming Language :: Python :: 3.9" not in metadata.get_all(
              "Classifier", []
          )
          print("Python support metadata: >=3.10")
          PY

      - name: Verify doctor (no unexpected failures)
        run: |
          ai-guardian doctor --json | python -c "
          import json, sys
          # These checks are expected to fail on a fresh install without scanners
          EXPECTED_FAILS = {'scanners', 'ps_cache_path'}
          data = json.load(sys.stdin)
          unexpected = [c for c in data['checks']
                        if c['status'] == 'fail' and c['name'] not in EXPECTED_FAILS]
          if unexpected:
              for f in unexpected:
                  print(f'FAIL: {f[\"name\"]}: {f[\"message\"]}', file=sys.stderr)
              sys.exit(1)
          print(f'doctor: {data[\"summary\"][\"pass\"]} pass, {data[\"summary\"][\"warn\"]} warn, {data[\"summary\"][\"skip\"]} skip')
          "

      - name: Verify setup --create-config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          test -f "$XDG_CONFIG_HOME/ai-guardian/ai-guardian.json"
          echo "Config file created successfully"

      - name: Verify config profiles
        run: |
          for profile in minimal standard strict; do
            export XDG_CONFIG_HOME=$(mktemp -d)
            ai-guardian setup --create-config --profile "@${profile}"
            test -f "$XDG_CONFIG_HOME/ai-guardian/ai-guardian.json"
            echo "Profile @${profile}: OK"
          done

      - name: Verify support defaults and explicit legacy destinations
        run: |
          ai-guardian support prepare --help
          ai-guardian support send --help
          ai-guardian support status --json
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from ai_guardian.setup.config import _get_default_config_template
          from ai_guardian.reporting.github_support import CATEGORIES, DESTINATION
          from ai_guardian.reporting.support_bundle import _get_support_config, _get_bundle_status

          defaults = _get_default_config_template(permissive=False)["support"]
          assert defaults["export_destination"] == DESTINATION
          assert defaults["github_category"] == "bug-reports"
          assert set(CATEGORIES) == {"bug-reports", "q-a"}
          with tempfile.TemporaryDirectory() as directory:
              os.environ["AI_GUARDIAN_CONFIG_DIR"] = directory
              os.chdir(directory)
              assert _get_support_config()["export_destination"] == DESTINATION
              path = Path(directory) / "ai-guardian.json"
              for saved in ({}, {"support": {}}, {"support": {"export_destination": ""}}):
                  path.write_text(json.dumps(saved))
                  assert _get_bundle_status()["destination_type"] == DESTINATION
              path.write_text(json.dumps({"support": {"export_destination": str(Path(directory) / "exports")}}))
              assert _get_bundle_status()["destination_type"] == "local"
          print("Support defaults/legacy compatibility verified; no diagnostics prepared or published")
          PY

      - name: Verify patterns list
        run: |
          ai-guardian patterns list --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Pattern categories: {len(data)}')
          assert len(data) > 0, 'No pattern categories found'
          "

      - name: Verify standalone NuGet V4 and Sonar tokens
        run: |
          python - <<'PY'
          from ai_guardian.scanners.toml_patterns import TomlPatternsScanner
          from tests.fixtures.nuget_sonar_tokens import CREDENTIAL_CASES

          scanner = TomlPatternsScanner()
          assert len(CREDENTIAL_CASES) == 4
          for rule_id, description, token in CREDENTIAL_CASES:
              assert any(
                  finding.rule_id == rule_id
                  and finding.description == description
                  and finding.matched_text == token
                  for finding in scanner.scan(token)
              ), f"Standalone credential not recognized: {rule_id}"
          print("Standalone NuGet V4/Sonar: 4 synthetic credentials detected")
          PY

      - name: Verify standalone research credentials
        run: |
          python - <<'PY'
          from ai_guardian.scanners.toml_patterns import TomlPatternsScanner
          from tests.fixtures.research_secret_tokens import CREDENTIAL_CASES

          scanner = TomlPatternsScanner()
          assert len(CREDENTIAL_CASES) == 8
          for rule_id, description, token in CREDENTIAL_CASES:
              assert any(
                  finding.rule_id == rule_id
                  and finding.description == description
                  and finding.matched_text == token
                  for finding in scanner.scan(token)
              ), f"Standalone credential not recognized: {rule_id}"
          print("Standalone research credentials: 8 synthetic values detected")
          PY

      - name: Verify show-config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          ai-guardian show-config --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Config sections: {len(data)}')
          "

  upgrade-from-previous:
    name: Stable Upgrade & Legacy Config Migration
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Determine previous stable version
        id: previous
        run: |
          PREVIOUS_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          current_match = re.search(
              r'^version\s*=\s*["\']([^"\']+)["\']',
              Path("pyproject.toml").read_text(encoding="utf-8"),
              flags=re.MULTILINE,
          )
          stable_versions = re.findall(
              r'^## \[(\d+\.\d+\.\d+)\]', changelog, flags=re.MULTILINE
          )
          current_version = (
              current_match.group(1).split("-", 1)[0] if current_match else ""
          )
          previous = next(
              (version for version in stable_versions if version != current_version),
              None,
          )
          if previous is None:
              raise SystemExit("Could not determine previous stable release")
          print(previous)
          PY
          )
          echo "version=${PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Previous stable version: ${PREVIOUS_VERSION}"

      - name: Install previous stable version
        run: |
          python -m pip install --upgrade pip
          pip install "ai-guardian==${{ steps.previous.outputs.version }}"

      - name: Generate old config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> $GITHUB_ENV
          ai-guardian setup --create-config
          echo "Old version: $(ai-guardian --version)"

      - name: Create old-format permissions (list format)
        run: |
          python << 'PYEOF'
          import json, pathlib, os
          cfg_path = pathlib.Path(os.environ["XDG_CONFIG_HOME"]) / "ai-guardian" / "ai-guardian.json"
          cfg = json.loads(cfg_path.read_text())
          cfg["permissions"] = [
              {"tool": "Bash", "permission": "allow", "pattern": "git *"},
              {"tool": "Read", "permission": "allow", "pattern": "*"}
          ]
          cfg_path.write_text(json.dumps(cfg, indent=2))
          print("Old-format permissions written")
          PYEOF

      - name: Upgrade to current version
        run: pip install .

      - name: Verify new version
        run: |
          NEW_VERSION=$(ai-guardian --version)
          echo "New version: $NEW_VERSION"
          python -c "
          import sys
          v = sys.argv[1]
          previous = sys.argv[2]
          assert previous not in v, f'Still on old version: {v}'
          print(f'Upgraded to: {v}')
          " "$NEW_VERSION" "${{ steps.previous.outputs.version }}"

      - name: Verify doctor after upgrade
        run: |
          ai-guardian doctor --json | python -c "
          import json, sys
          # Expected failures on upgrade without scanners installed
          EXPECTED_FAILS = {'scanners', 'ps_cache_path', 'permissions'}
          data = json.load(sys.stdin)
          unexpected = [c for c in data['checks']
                        if c['status'] == 'fail' and c['name'] not in EXPECTED_FAILS]
          if unexpected:
              for f in unexpected:
                  print(f'FAIL: {f[\"name\"]}: {f[\"message\"]}', file=sys.stderr)
              sys.exit(1)
          print('Doctor passed after upgrade (expected failures excluded)')
          "

      - name: Verify permissions auto-normalized
        run: |
          python << 'PYEOF'
          import json, pathlib, os
          cfg_path = pathlib.Path(os.environ["XDG_CONFIG_HOME"]) / "ai-guardian" / "ai-guardian.json"
          cfg = json.loads(cfg_path.read_text())
          perms = cfg.get("permissions", {})
          if isinstance(perms, list):
              print("Permissions still in old list format (migration happens on config load, not on disk)")
          elif isinstance(perms, dict):
              print(f"Permissions normalized to dict format: enabled={perms.get('enabled')}")
              rules = perms.get("rules", [])
              print(f"Rules count: {len(rules)}")
          else:
              print(f"Unexpected permissions type: {type(perms)}")
          PYEOF

  multi-agent-setup:
    name: IDE Registry, Setup & Documentation Parity
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ai-guardian
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Verify supported IDE registry parity
        run: python -m pytest tests/unit/test_ide_registry.py -q

      - name: Test IDE adapter setup
        run: |
          IDES="claude cursor copilot grok codex windsurf gemini antigravity cline zoocode kiro aiderdesk openclaw opencode pi augment crush junie goose"
          FAILED=""
          for ide in $IDES; do
            echo "--- Testing setup --ide $ide ---"
            WORK_DIR=$(mktemp -d)
            export HOME="$WORK_DIR/home"
            export USERPROFILE="$HOME"
            mkdir -p "$HOME"
            export XDG_CONFIG_HOME=$(mktemp -d)
            ai-guardian setup --create-config
            (cd "$WORK_DIR" && ai-guardian setup --ide "$ide" --yes) && \
              echo "  $ide: OK" || \
              { echo "  $ide: FAILED"; FAILED="$FAILED $ide"; }
            if [ "$ide" = "cursor" ]; then
              test -f "$HOME/.cursor/hooks.json"
              test -f "$HOME/.cursor/mcp.json"
              test ! -f "$WORK_DIR/.cursor/hooks.json"
              test ! -f "$WORK_DIR/.cursor/mcp.json"

              CLOUD_PROJECT="$WORK_DIR/cloud-project"
              mkdir -p "$CLOUD_PROJECT"
              (cd "$WORK_DIR" && ai-guardian setup --ide cursor --project "$CLOUD_PROJECT" --yes)
              test -f "$CLOUD_PROJECT/.cursor/hooks.json"
              test ! -f "$CLOUD_PROJECT/.cursor/mcp.json"
              test -f "$HOME/.cursor/hooks.json"
              test -f "$HOME/.cursor/mcp.json"
            fi
            if [ "$ide" = "grok" ]; then
              test -f "$HOME/.grok/hooks/ai-guardian.json"
              test -f "$HOME/.grok/config.toml"
              test ! -f "$WORK_DIR/.grok/hooks/ai-guardian.json"
              test ! -f "$WORK_DIR/.grok/config.toml"

              GROK_PROJECT="$WORK_DIR/grok-project"
              mkdir -p "$GROK_PROJECT"
              (cd "$WORK_DIR" && ai-guardian setup --ide grok --project "$GROK_PROJECT" --yes)
              test -f "$GROK_PROJECT/.grok/hooks/ai-guardian.json"
              test -f "$GROK_PROJECT/.grok/config.toml"
            fi
            if [ "$ide" = "goose" ]; then
              test -f "$HOME/.agents/plugins/ai-guardian-goose/hooks/hooks.json"
              test -f "$HOME/.agents/plugins/ai-guardian-goose/.mcp.json"
              test ! -d "$WORK_DIR/.agents"
              GOOSE_PROJECT="$WORK_DIR/goose-project"
              mkdir -p "$GOOSE_PROJECT"
              (cd "$WORK_DIR" && ai-guardian setup --ide goose --project "$GOOSE_PROJECT" --yes)
              test -f "$GOOSE_PROJECT/.agents/plugins/ai-guardian-goose/hooks/hooks.json"
              test -f "$GOOSE_PROJECT/.agents/plugins/ai-guardian-goose/.mcp.json"
            fi
            rm -rf "$WORK_DIR"
          done

          if [ -n "$FAILED" ]; then
            echo "Failed IDE setups:$FAILED"
            exit 1
          fi
          echo "All IDE adapters set up successfully"

      - name: Verify integration and scanner documentation exists
        run: |
          test -f docs/AGENT_SUPPORT.md
          test -f docs/IDE_INTEGRATION_CHECKLIST.md
          test -f docs/CLI_RUNTIME_CHECKLIST.md
          test -f docs/SCANNER_INTEGRATION_CHECKLIST.md

  ide-hook-e2e:
    name: IDE Hook Integration E2E (${{ matrix.variant }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: claude
            variant: claude
          - ide: cursor
            variant: cursor
          - ide: copilot
            variant: copilot
          - ide: grok
            variant: grok
          - ide: codex
            variant: codex
          - ide: windsurf
            variant: windsurf
          - ide: gemini
            variant: gemini
          - ide: antigravity
            variant: antigravity
          - ide: cline
            variant: cline
          - ide: zoocode
            variant: zoocode
          - ide: kiro
            variant: kiro
          - ide: aiderdesk
            variant: aiderdesk
          - ide: openclaw
            variant: openclaw
          - ide: opencode
            opencode_generation: v1
            variant: opencode-v1
          - ide: opencode
            opencode_generation: v2
            variant: opencode-v2
          - ide: pi
            variant: pi
          - ide: augment
            variant: augment
          - ide: crush
            variant: crush
          - ide: junie
            variant: junie
          - ide: goose
            variant: goose

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ai-guardian and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Set up Node for OpenCode plugin contracts
        if: matrix.ide == 'opencode' && matrix.opencode_generation == 'v1'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Goose protocol and host-only boundary
        if: matrix.ide == 'goose'
        run: >-
          python -m pytest tests/unit/test_goose_support.py
          tests/unit/test_goose_setup.py
          tests/ux/test_user_experience_contract_goose.py -q

      - name: Verify shared OpenCode paths, workspace routing and safe diagnostics
        if: matrix.ide == 'opencode' && matrix.opencode_generation == 'v1'
        run: |
          python -m pytest \
            tests/unit/test_opencode_input.py \
            tests/unit/test_opencode_support.py \
            tests/unit/test_setup.py \
            tests/unit/test_typescript_bridge.py \
            tests/unit/test_mcp_server.py \
            tests/unit/test_policy_decision.py \
            tests/unit/test_web_violation_detail.py \
            tests/unit/test_web_violation_copy.py \
            tests/ux/test_user_experience_contract_opencode_self_protection.py \
            tests/ux/test_user_experience_contract_agent_config.py \
            tests/ux/test_user_experience_contract_violation_guidance.py \
            tests/ux/test_user_experience_contract_ide_setup.py -q

      - name: Run isolated ${{ matrix.variant }} hook matrix
        env:
          AI_GUARDIAN_TEST_IDE: ${{ matrix.ide }}
          AI_GUARDIAN_TEST_OPENCODE_GENERATION: ${{ matrix.opencode_generation || '' }}
        run: python -m pytest tests/integration/test_ide_hooks_e2e.py -q

  daemon-lifecycle:
    name: Daemon, REST, SSH, Tray, Support & Release Checks
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ai-guardian
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify native daemon HTTPS and explicit trust contracts
        run: |
          pip install pytest
          python -m pytest tests/unit/test_daemon_tls.py tests/unit/test_daemon_tls_config.py tests/ux/test_user_experience_contract_daemon_tls.py -q

      - name: Verify SSH pairing, protected storage and polling-only REST contracts
        run: |
          pip install pytest-asyncio
          python -m pytest tests/unit/test_ssh_config.py tests/unit/test_ssh_alias_discovery_config.py tests/unit/test_ssh_discovery_settings.py tests/unit/test_ssh_storage.py tests/unit/test_ssh_tunnel.py tests/unit/test_ssh_probe.py tests/unit/test_ssh_connections.py tests/unit/test_ssh_commands.py tests/unit/test_ssh_tray.py tests/unit/test_ssh_menu_parity.py tests/unit/test_ssh_plugins.py tests/unit/test_web_ssh_connections.py tests/ux/test_user_experience_contract_ssh_daemons.py -q

      - name: Verify tray monitor context and explicit desktop-placement fallbacks
        run: |
          python -m ai_guardian tray-target-select --help | grep -- '--screen-bounds'
          python -m pytest tests/unit/test_monitor_placement.py tests/unit/test_modal.py tests/unit/test_modal_channel.py tests/unit/test_modal_forms.py tests/unit/test_working_dir.py tests/unit/test_tray_target_selector.py tests/unit/test_tray_pause.py tests/unit/test_pause_controls_ui.py tests/ux/test_user_experience_contract_monitor_placement.py tests/ux/test_user_experience_contract_modals.py tests/ux/test_user_experience_contract_tray_pause.py -q

      - name: Verify authenticated per-daemon support collection and desktop consent
        run: |
          python -m pytest tests/unit/test_daemon_support.py tests/unit/test_remote_support.py tests/unit/test_tray_support.py tests/ux/test_user_experience_contract_support.py -q

      - name: Verify release announcement CLI and mocked publication contracts
        run: |
          python .claude/skills/release/release_helper.py announce-release --help
          python -m pytest tests/unit/test_release_helper.py tests/unit/test_release_script.py -q

      - name: Create config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> $GITHUB_ENV
          ai-guardian setup --create-config

      - name: Start daemon
        run: |
          ai-guardian daemon start --background
          sleep 2

      - name: Verify daemon status
        run: ai-guardian daemon status

      - name: Verify daemon reload
        run: ai-guardian daemon reload

      - name: Verify top-level pause and resume
        run: |
          ai-guardian pause 1
          ai-guardian resume
          ai-guardian pause
          ai-guardian resume

      - name: Verify top-level directory and session scopes
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from ai_guardian.daemon.client import send_hook_request, send_status_request

          def command(*arguments, expected=0):
              result = subprocess.run(
                  ['ai-guardian', *arguments], capture_output=True, text=True, timeout=30
              )
              assert result.returncode == expected, (arguments, result.stdout, result.stderr)

          def stats():
              result = send_status_request()
              assert result is not None, 'Daemon status unavailable'
              return result

          with tempfile.TemporaryDirectory() as root:
              project = Path(root) / 'shared-project'
              project.mkdir()
              previous_directory = Path.cwd()
              try:
                  # Hook transport records the caller's cwd, not a payload override.
                  os.chdir(project)
                  for session_id in ('readiness-first', 'readiness-second'):
                      response = send_hook_request({
                          'hook_event_name': 'SessionStart',
                          'session_id': session_id,
                          'cwd': str(project),
                      })
                      assert response is not None, 'Session registration failed'
              finally:
                  os.chdir(previous_directory)
              sessions = {
                  session['session_id']: session['session_key']
                  for session in stats()['active_sessions']
              }
              first = sessions['readiness-first']
              second = sessions['readiness-second']
              directory = os.path.realpath(project)
              assert all(
                  session['project_dir'] == directory
                  for session in stats()['active_sessions']
                  if session['session_key'] in (first, second)
              )
              alias = str(project / '..' / 'shared-project')
              for duration in (['1'], [], ['0']):
                  command('pause', *duration, '--dir', alias)
                  snapshot = stats()
                  assert directory in snapshot['paused_dirs']
                  assert not snapshot['paused']
                  command('resume', '--dir', alias)
                  assert directory not in stats()['paused_dirs']

                  command('pause', *duration, '--session', first)
                  paused = {s['session_key']: s['paused'] for s in stats()['active_sessions']}
                  assert paused[first] and not paused[second]
                  assert not stats()['paused'] and not stats()['paused_dirs']
                  command('resume', '--session', first)
                  assert not any(s['paused'] for s in stats()['active_sessions'])

              # Legacy syntax stays supported; resume removes only its own layer.
              command('daemon', 'pause', '--minutes', '1', '--dir', alias)
              command('pause', '--session', first)
              command('pause')
              command('resume', '--session', first)
              assert stats()['paused'] and directory in stats()['paused_dirs']
              command('resume', '--dir', alias)
              assert stats()['paused']
              command('resume')
              assert not stats()['paused'] and not stats()['paused_dirs']

              for operation in ('pause', 'resume'):
                  command(operation, '--session', 'not-an-active-session', expected=1)
                  command(operation, '--dir', alias, '--session', first, expected=2)
                  for selector in ('--dir', '--session'):
                      command(operation, selector, expected=2)
                      command(operation, selector, '', expected=2)
              for duration in ('-1', '1441', 'not-an-integer'):
                  command('pause', duration, '--session', first, expected=2)
              assert not stats()['paused'] and not stats()['paused_dirs']
              assert not any(s['paused'] for s in stats()['active_sessions'])
          PY

      - name: Test REST API
        run: |
          # Read REST port from PID file
          REST_PORT=$(python -c "
          import json
          from ai_guardian.daemon import get_pid_path
          data = json.load(open(get_pid_path()))
          print(data.get('rest_port', 63152))
          ")
          echo "REST API port: $REST_PORT"

          # Read auto-generated auth token
          AUTH_TOKEN=$(python -c "
          from ai_guardian.daemon import get_auth_token_path
          p = get_auth_token_path()
          print(p.read_text().strip() if p.exists() else '')
          ")
          echo "Auth token present: $([ -n "$AUTH_TOKEN" ] && echo yes || echo no)"

          echo "Testing /api/health..."
          curl -sf "http://127.0.0.1:${REST_PORT}/api/health" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Unexpected: {data}'
          print('Health: OK')
          "

          echo "Testing /api/status..."
          curl -sf -H "Authorization: Bearer ${AUTH_TOKEN}" \
            "http://127.0.0.1:${REST_PORT}/api/status" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['running'] is True, f'Not running: {data}'
          print(f'Status: running={data[\"running\"]}, paused={data[\"paused\"]}')
          "

          echo "Testing /api/pause..."
          curl -sf -X POST -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H "Content-Type: application/json" -d '{"minutes": 1}' \
            "http://127.0.0.1:${REST_PORT}/api/pause" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['status'] == 'paused', f'Not paused: {data}'
          print('Pause: OK')
          "

          echo "Testing /api/resume..."
          curl -sf -X POST -H "Authorization: Bearer ${AUTH_TOKEN}" \
            "http://127.0.0.1:${REST_PORT}/api/resume" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['status'] == 'resumed', f'Not resumed: {data}'
          print('Resume: OK')
          "

      - name: Stop daemon
        run: |
          ai-guardian daemon stop
          sleep 1
          # Verify stopped
          if ai-guardian daemon status 2>&1 | grep -q "not running\|No daemon"; then
            echo "Daemon stopped successfully"
          else
            echo "Warning: daemon may still be running"
          fi

      - name: Verify scoped controls do not auto-start a stopped daemon
        run: |
          python - <<'PY'
          import subprocess
          from ai_guardian.daemon import get_state_dir
          from ai_guardian.daemon.client import is_daemon_running

          assert not is_daemon_running(), 'Daemon did not stop'
          pause_file = get_state_dir() / 'daemon.paused'
          before = pause_file.read_bytes() if pause_file.exists() else None
          for operation in ('pause', 'resume'):
              for selector in ([], ['--dir', '.'], ['--session', 'not-an-active-session']):
                  result = subprocess.run(
                      ['ai-guardian', operation, *selector],
                      capture_output=True, text=True, timeout=30,
                  )
                  assert result.returncode == 1, (result.stdout, result.stderr)
                  assert 'daemon is not running' in result.stderr
                  assert not is_daemon_running(), 'Control command auto-started a daemon'
          after = pause_file.read_bytes() if pause_file.exists() else None
          assert after == before, 'Offline controls changed persisted pause state'
          PY

  smoke-tests:
    name: Detection, Hook, False-Positive, Initialization & Lifecycle Smokes
    # Includes the shared Linux/macOS/native-Windows orphan-recovery gate.
    uses: ./.github/workflows/smoke-tests.yml

  scenario-tests:
    name: Container Agent Scenarios (minimal, standard, strict)
    uses: ./.github/workflows/scenario-tests.yml

  container-build-validation:
    name: Container Smoke, Scenarios & Multi-Arch Builds
    needs: fresh-install
    uses: ./.github/workflows/container-build-validation.yml

  container-images:
    name: Real CLI Smoke Matrix & OpenShell Image Validation
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build AI Guardian wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          mkdir -p container/vendor
          cp dist/*.whl container/vendor/
          WHEEL=$(basename container/vendor/ai_guardian-*.whl)
          echo "WHEEL=${WHEEL}" >> "$GITHUB_ENV"

      - name: Install current wheel for sandbox lifecycle
        run: python -m pip install dist/*.whl

      # Check the local version-selection interface without changing the existing
      # prebuilt-image/cache strategy or passing a build pin with --image below.
      - name: Verify smoke CLI version selection arguments
        run: |
          python - <<'PY'
          import subprocess
          import sys

          command = [sys.executable, "scripts/agent_cli_test.py"]
          help_result = subprocess.run(
              [*command, "--help"], check=True, capture_output=True, text=True
          )
          if "--cli-version VERSION" not in help_result.stdout:
              raise SystemExit("Smoke runner is missing --cli-version help")
          result = subprocess.run(
              [*command, "--cli-name", "opencode", "--agent", "build",
               "--cli-version", "2.0.24", "--image", "ai-guardian-readiness"],
              capture_output=True, text=True,
          )
          if result.returncode != 2 or "--cli-version and --image cannot be combined" not in result.stderr:
              raise SystemExit("Smoke version/image conflict did not fail closed")
          print("PASS smoke CLI version help and supplied-image guard")
          PY

      - name: Build normal support image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg AI_GUARDIAN_VERSION="$WHEEL" \
            -t ai-guardian-readiness \
            container/

      - name: Build pinned OpenCode V2 smoke image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg AI_GUARDIAN_VERSION="$WHEEL" \
            --build-arg OPENCODE_VERSION=2.0.24 \
            -t ai-guardian-opencode-v2-readiness \
            container/

      - name: Verify standard image CLIs and Pi extension (OpenCode V1, Gemini, Pi)
        run: |
          opencode_v1_version="$(docker run --rm --entrypoint opencode ai-guardian-readiness --version)"
          echo "OpenCode V1: $opencode_v1_version"
          test "$opencode_v1_version" = "1.19.0"
          docker run --rm --entrypoint gemini ai-guardian-readiness --version
          docker run --rm --entrypoint pi ai-guardian-readiness --version
          docker run --rm \
            -e AI_GUARDIAN_AGENT=pi \
            -e AI_GUARDIAN_SETUP_SCOPE=selected \
            -e AI_GUARDIAN_HOST_CONFIG_MOUNTED=false \
            ai-guardian-readiness \
            /bin/bash -lc 'test -x "$(command -v pi)" && test -f /sandbox/.pi/agent/extensions/ai-guardian/index.ts'

      - name: Verify pinned OpenCode V2 smoke image version
        id: smoke_prerequisites
        run: |
          opencode_v2_version="$(docker run --rm --entrypoint opencode ai-guardian-opencode-v2-readiness --version)"
          opencode_v2_version="${opencode_v2_version#opencode v}"
          echo "OpenCode V2: $opencode_v2_version"
          test "$opencode_v2_version" = "2.0.24"

      # Each invocation prepares a strict-derived config before creation: prompt /
      # pre-tool deny (including command credential arguments and Claude/OpenCode native
      # Write HTTP-source credential flows in Python, JavaScript, and TypeScript),
      # environment-backed clean Write cases, clean-tool and sensitive-output
      # sanitization cases. The Write cases run only
      # for clients exposing a recognized native Write tool. This is
      # not unmodified @strict post-tool qualification. Keep each client in its own
      # named step and continue after an individual failure so all results are
      # visible. Codex's unresolved smoke failure is temporarily non-blocking for
      # release readiness, but stays a failed step and is reported in the summary;
      # it does not qualify Codex. Other client failures remain job-blocking.
      # Codex's invocation-only hook-trust override is used only after the runner
      # verifies its exact isolated AI Guardian hook set; no persistent Codex trust
      # state is written.
      - name: Codex CLI Smoke (local mock provider)
        id: codex_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        # Temporary release exception until Codex passes the native execution and
        # output-evidence checks; do not interpret the allowed failure as a pass.
        continue-on-error: true
        run: |
          scripts/agent-cli-test --cli-name codex --agent smoke \
            --image ai-guardian-readiness --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: Report tolerated Codex smoke failure
        if: ${{ !cancelled() && steps.codex_smoke.outcome == 'failure' }}
        run: |
          echo "::warning::Codex CLI smoke failed and is temporarily allowed for Release Readiness; this does not qualify Codex."
          {
            echo "### Codex CLI smoke failure temporarily allowed"
            echo
            echo "The Codex smoke step failed. This exception allows Release Readiness to continue, but it is not a passing smoke result or Codex qualification."
            echo "Remove this exception only after native execution and all existing evidence checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gemini CLI Smoke (local mock provider)
        id: gemini_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          scripts/agent-cli-test --cli-name gemini --agent default \
            --image ai-guardian-readiness --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: Build Goose host-CLI smoke-only image (Apache-2.0)
        id: goose_smoke_image
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          # Test-only overlay, not part of either published runtime image.
          mkdir -p "$RUNNER_TEMP/goose-smoke"
          cat > "$RUNNER_TEMP/goose-smoke/Dockerfile" <<'EOF'
          FROM ai-guardian-readiness
          USER root
          RUN curl -fL https://github.com/aaif-goose/goose/releases/download/v1.59.0/goose-x86_64-unknown-linux-musl.tar.gz -o /tmp/goose.tar.gz \
              && echo '6da57ce8775f712ab146bcf244b69e2b15f85368836bff2ba3306fdefdac8f31  /tmp/goose.tar.gz' | sha256sum -c - \
              && tar -xzf /tmp/goose.tar.gz -C /usr/local/bin \
              && mkdir -p /usr/share/licenses/goose \
              && curl -fL https://raw.githubusercontent.com/aaif-goose/goose/v1.59.0/LICENSE -o /usr/share/licenses/goose/LICENSE \
              && rm /tmp/goose.tar.gz
          USER sandbox
          RUN goose --version
          EOF
          docker build -t ai-guardian-goose-smoke "$RUNNER_TEMP/goose-smoke"

      - name: Goose host CLI Smoke (local mock; not runtime qualification)
        id: goose_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          scripts/agent-cli-test --cli-name goose --agent default \
            --image ai-guardian-goose-smoke --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: OpenCode V1 CLI Smoke (local mock provider)
        id: opencode_v1_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          scripts/agent-cli-test --cli-name opencode --agent build \
            --image ai-guardian-readiness --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: Pi CLI Smoke (local mock provider)
        id: pi_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          scripts/agent-cli-test --cli-name pi --agent openai \
            --image ai-guardian-readiness --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: OpenCode V2 CLI Smoke (local mock provider)
        id: opencode_v2_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        run: |
          scripts/agent-cli-test --cli-name opencode --agent build \
            --image ai-guardian-opencode-v2-readiness --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: Claude Code CLI Smoke (local mock provider)
        id: claude_smoke
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' && vars.AI_GUARDIAN_CLAUDE_CODE_TOS_ACCEPTED == 'true' }}
        run: |
          scripts/agent-cli-test --cli-name claude --agent default \
            --accept-proprietary-tos --container-engine docker \
            --ai-guardian-command ai-guardian

      - name: Explain skipped Claude Code smoke check
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' && vars.AI_GUARDIAN_CLAUDE_CODE_TOS_ACCEPTED != 'true' }}
        run: |
          echo "::notice::Claude Code smoke check was not run. Set the repository variable AI_GUARDIAN_CLAUDE_CODE_TOS_ACCEPTED=true only after an authorized maintainer accepts Anthropic's terms for CI installation."

      - name: Build OpenShell support image
        id: build_openshell_image
        if: ${{ !cancelled() && steps.smoke_prerequisites.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build \
            -f container/Dockerfile.openshell \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg AI_GUARDIAN_VERSION="$WHEEL" \
            -t ai-guardian-openshell-readiness \
            container/

      - name: Verify OpenShell image Codex and OpenCode CLI setup
        if: ${{ !cancelled() && steps.build_openshell_image.outcome == 'success' }}
        run: |
          docker run --rm --entrypoint codex ai-guardian-openshell-readiness --version
          docker run --rm --entrypoint opencode ai-guardian-openshell-readiness --version
          docker run --rm \
            -e AI_GUARDIAN_AGENT=codex \
            -e AI_GUARDIAN_SETUP_SCOPE=selected \
            -e AI_GUARDIAN_HOST_CONFIG_MOUNTED=false \
            ai-guardian-openshell-readiness \
            /bin/bash -lc 'test -x "$(command -v codex)" && test -x "$(command -v opencode)"'

      - name: Verify OpenShell compatibility metadata
        if: ${{ !cancelled() && steps.build_openshell_image.outcome == 'success' }}
        run: |
          test "$(docker inspect --format='{{index .Config.Labels "ai-guardian.compatibility-report-schema"}}' ai-guardian-openshell-readiness)" = "2"
          test "$(docker inspect --format='{{index .Config.Labels "ai-guardian.openshell.base-image"}}' ai-guardian-openshell-readiness)" = "nvcr.io/nvidia/base/ubuntu@sha256:c280ee89f8bfcbdaba6179ad4347f60c509e841cbe63eb93002f01bf70e0819c"
          test -n "$(docker inspect --format='{{index .Config.Labels "ai-guardian.openshell.codex-version"}}' ai-guardian-openshell-readiness)"
          test -n "$(docker inspect --format='{{index .Config.Labels "ai-guardian.openshell.opencode-version"}}' ai-guardian-openshell-readiness)"

  config-validation:
    name: Configuration, Migration & Security Feature Qualification
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ai-guardian
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify doctor with fresh config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          ai-guardian doctor --json | python -c "
          import json, sys
          EXPECTED_FAILS = {'scanners', 'ps_cache_path'}
          data = json.load(sys.stdin)
          unexpected = [c for c in data['checks']
                        if c['status'] == 'fail' and c['name'] not in EXPECTED_FAILS]
          if unexpected:
              for f in unexpected:
                  print(f'FAIL: {f[\"name\"]}: {f[\"message\"]}', file=sys.stderr)
              sys.exit(1)
          print('Doctor validation: OK')
          "

      - name: Verify unified tracing configuration
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          python -c "
          import json, os
          from ai_guardian.config.loaders import resolve_tracing_config
          path = os.path.join(os.environ['XDG_CONFIG_HOME'], 'ai-guardian', 'ai-guardian.json')
          config = json.load(open(path))
          assert config['tracing']['enabled'] is True
          assert resolve_tracing_config(config)['trace_cache_retention_days'] == 90
          legacy = {'sdk': {'trace_viewer': {'enabled': False}}}
          assert resolve_tracing_config(legacy)['enabled'] is False
          mixed = {**legacy, 'tracing': {'enabled': True}}
          assert resolve_tracing_config(mixed)['enabled'] is True
          print('Unified tracing config: OK')
          "

      - name: Verify remote violation mirroring defaults off
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          python -c "
          import json, os
          path = os.path.join(os.environ['XDG_CONFIG_HOME'], 'ai-guardian', 'ai-guardian.json')
          cfg = json.load(open(path))
          assert cfg['violation_logging']['mirror_remote_violations'] is False
          print('Remote violation mirroring default: off')
          "

      - name: Test old permissions list migration
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          CFG_PATH="$XDG_CONFIG_HOME/ai-guardian/ai-guardian.json"

          # Inject old-format permissions
          python << PYEOF
          import json, os
          cfg_path = os.environ["XDG_CONFIG_HOME"] + "/ai-guardian/ai-guardian.json"
          cfg = json.load(open(cfg_path))
          cfg["permissions"] = [
              {"tool": "Bash", "permission": "allow", "pattern": "ls *"}
          ]
          json.dump(cfg, open(cfg_path, "w"), indent=2)
          PYEOF

          # Doctor should handle migration gracefully
          ai-guardian doctor --json | python -c "
          import json, sys
          EXPECTED_FAILS = {'scanners', 'ps_cache_path', 'permissions'}
          data = json.load(sys.stdin)
          unexpected = [c for c in data['checks']
                        if c['status'] == 'fail' and c['name'] not in EXPECTED_FAILS]
          if unexpected:
              for f in unexpected:
                  print(f'FAIL: {f[\"name\"]}: {f[\"message\"]}', file=sys.stderr)
              sys.exit(1)
          print(f'Doctor after migration: {data[\"summary\"][\"pass\"]} pass, {data[\"summary\"][\"warn\"]} warn')
          "

      - name: Test all config profiles
        run: |
          for profile in minimal standard strict; do
            echo "--- Profile: @${profile} ---"
            export XDG_CONFIG_HOME=$(mktemp -d)
            ai-guardian setup --create-config --profile "@${profile}"
            CFG_PATH="$XDG_CONFIG_HOME/ai-guardian/ai-guardian.json"
            python -c "
          import json
          cfg = json.load(open('$CFG_PATH'))
          assert cfg['violation_logging']['mirror_remote_violations'] is False
          assert cfg['violation_notifications'] == {
              'by_type': {},
              'email': {'recipient': ''},
          }
          print(f'  Keys: {sorted(cfg.keys())[:5]}...')
          print(f'  Valid JSON: yes')
            "
          done

      - name: Install qualification test dependencies
        run: python -m pip install '.[dev]'

      - name: Test violation history, mirroring, and notifications
        run: |
          python -m pytest tests/unit/test_violation_notifications.py tests/unit/test_violation_logger.py tests/unit/test_violation_mirroring.py tests/unit/test_violation_logging_types.py tests/unit/test_daemon_rest_api.py tests/unit/test_daemon_multi_client.py tests/unit/test_profile_manager.py tests/unit/test_json_schema.py tests/unit/test_config_scope.py tests/unit/test_project_config_overlay.py tests/unit/test_help_tooltips.py tests/unit/test_tray_notifications.py tests/unit/test_web_violation_detail.py tests/ux/test_user_experience_contract_violation_notifications.py tests/ux/test_user_experience_contract_violation_mirroring.py -q

      - name: Qualify experimental local password-likelihood stage
        run: |
          python -m pytest tests/unit/test_password_likelihood.py tests/unit/test_password_likelihood_ask.py tests/unit/test_password_likelihood_autosave.py tests/unit/test_password_likelihood_integration.py tests/unit/test_password_likelihood_quality.py tests/unit/test_violation_guidance.py tests/ux/test_password_likelihood_contract.py tests/ux/test_user_experience_contract_posttooluse_secret.py tests/ux/test_user_experience_contract_violation_guidance.py -v
          python scripts/qualify_password_likelihood.py
          # Synthetic/performance gates are automated; independently adjudicated
          # real corpora and actual pre-model host evidence remain manual gates.
          # Do not infer prevention from this job's hook response assertions.

      - name: Test project-level + user-level config merge
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          PROJECT_DIR=$(mktemp -d)

          # Create user-level (global) config
          ai-guardian setup --create-config

          # Create project-level config with an override
          mkdir -p "$PROJECT_DIR/.ai-guardian"
          cat > "$PROJECT_DIR/.ai-guardian/ai-guardian.json" << 'PROJCFG'
          {
            "name": "test-project-overlay",
            "secret_scanning": {
              "enabled": true
            }
          }
          PROJCFG

          # Point config loader to the project config
          export AI_GUARDIAN_PROJECT_CONFIG="$PROJECT_DIR/.ai-guardian/ai-guardian.json"

          # Verify merged config contains the project overlay
          ai-guardian show-config --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          # The project 'name' should override the global config
          print('Config merge test: OK (project overlay loaded)')
          "
          rm -rf "$PROJECT_DIR"

      - name: Verify config show --json
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          ai-guardian config show --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'config show: {len(data)} top-level keys')
          "

      - name: Verify show-config --json
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          ai-guardian setup --create-config
          ai-guardian show-config --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'show-config: {len(data)} top-level keys')
          "

  install-script:
    name: POSIX Install Tests (Linux/macOS, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test install.sh --help
        run: bash install.sh --help

      - name: Test install.sh syntax
        run: bash -n install.sh

      - name: Test install.sh with --profile
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          bash install.sh --profile @standard --ide claude
          # install.sh auto-detects venv+pip when uv is absent; binary lands in venv
          "$HOME/.ai-guardian-venv/bin/ai-guardian" --version || ai-guardian --version
          test -f "$XDG_CONFIG_HOME/ai-guardian/ai-guardian.json"
          echo "Install script: OK"

      - name: Test install.sh with --venv
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          bash install.sh --venv --ide claude
          test -d "$HOME/.ai-guardian-venv"
          "$HOME/.ai-guardian-venv/bin/ai-guardian" --version
          echo "Venv install: OK"

  mcp-server:
    name: MCP Initialize & get_config JSON-RPC Calls
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ai-guardian
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create config
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> $GITHUB_ENV
          ai-guardian setup --create-config

      - name: Test MCP server responds to initialize
        run: |
          # MCP uses JSON-RPC over stdio — use Python to avoid shell quoting issues
          python << 'PYEOF'
          import subprocess, json, sys

          init_req = json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "test", "version": "1.0"}
              }
          })

          proc = subprocess.run(
              ["ai-guardian", "mcp-server"],
              input=init_req + "\n",
              capture_output=True, text=True, timeout=10
          )

          stdout = proc.stdout.strip()
          if not stdout:
              print("MCP server started and exited cleanly (no output)")
              sys.exit(0)

          for line in stdout.split("\n"):
              line = line.strip()
              if not line:
                  continue
              try:
                  msg = json.loads(line)
                  if msg.get("id") == 1 and "result" in msg:
                      server_info = msg["result"].get("serverInfo", {})
                      print(f"MCP server responded: {server_info.get('name')} v{server_info.get('version')}")
                      sys.exit(0)
              except json.JSONDecodeError:
                  continue

          print(f"MCP server produced output ({len(stdout)} bytes)")
          PYEOF

      - name: Test MCP server tool call
        run: |
          python << 'PYEOF'
          import subprocess, json, sys

          init_req = json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "test", "version": "1.0"}
              }
          })
          initialized_notif = json.dumps({
              "jsonrpc": "2.0", "method": "notifications/initialized"
          })
          tool_call = json.dumps({
              "jsonrpc": "2.0", "id": 2, "method": "tools/call",
              "params": {"name": "get_config", "arguments": {}}
          })

          stdin_data = init_req + "\n" + initialized_notif + "\n" + tool_call + "\n"

          proc = subprocess.run(
              ["ai-guardian", "mcp-server"],
              input=stdin_data, capture_output=True, text=True, timeout=15
          )

          stdout = proc.stdout.strip()
          if stdout:
              for line in stdout.split("\n"):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      msg = json.loads(line)
                      if msg.get("id") == 2:
                          print(f"Tool call response received (id=2)")
                          sys.exit(0)
                  except json.JSONDecodeError:
                      continue
              print(f"MCP server produced output ({len(stdout)} bytes)")
          else:
              print("MCP server started and exited cleanly")

          if proc.returncode in (0, None, -15):
              print("MCP server test: OK")
          else:
              print(f"MCP server exited with code {proc.returncode}")
              if proc.stderr:
                  print(f"stderr (truncated): {proc.stderr[:500]}")
          PYEOF

  openshell-middleware-runtime:
    name: OpenShell Middleware Compatibility & Runtime Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify OpenShell release compatibility contract
        run: python scripts/check_openshell_compatibility.py

      - name: Run Rust middleware tests
        run: cargo test --manifest-path rust/openshell-middleware/Cargo.toml
