# GitHub Actions CI/CD - Build Container Image
# Publishes to quay.io/redhatproductsecurity/ai-guardian:
#   - :latest         on every successful merge to main  (triggered by Build Wheel)
#   - :VERSION        on clean release tags (v1.2.3)
#
# Required secrets: QUAY_RPS_USERNAME, QUAY_RPS_PASSWORD (primary registry)
#                   QUAY_USERNAME, QUAY_PASSWORD (legacy mirror — remove in v2.0, see #1774)
# Required: quay.io/redhatproductsecurity/ai-guardian repo created and set to public

name: Build Container Image

on:
  workflow_run:
    workflows: ["Build Wheel"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      skip_legacy_mirror:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: latest)"
        required: false
        default: "latest"

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # For workflow_run: only run when Build Wheel succeeded.
    # For push/dispatch/workflow_call (via scenario-tests): always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Determine build parameters
        id: params
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "wheel_source=artifact" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"

          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" == *-test* ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping test tag: $TAG"
            else
              echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "wheel_source=build" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi

          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
            echo "image_tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
            echo "wheel_source=build" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"

          else
            # workflow_call (from scenario-tests) — use commit SHA
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "wheel_source=build" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.params.outputs.skip != 'true'
        uses: actions/checkout@v7

      # --- Dev image: download wheel from Build Wheel artifact ---
      - name: Download dev wheel
        if: steps.params.outputs.skip != 'true' && steps.params.outputs.wheel_source == 'artifact'
        uses: actions/download-artifact@v8
        with:
          name: ai-guardian-dev-wheel
          path: container/vendor/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Release image: build wheel from source ---
      - name: Set up Python
        if: steps.params.outputs.skip != 'true' && steps.params.outputs.wheel_source == 'build'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build release wheel
        if: steps.params.outputs.skip != 'true' && steps.params.outputs.wheel_source == 'build'
        run: |
          pip install build
          python -m build --wheel
          cp dist/*.whl container/vendor/

      # --- Resolve wheel filename for AI_GUARDIAN_VERSION build-arg ---
      - name: Resolve wheel filename
        if: steps.params.outputs.skip != 'true'
        id: wheel
        run: |
          WHL=$(ls container/vendor/ai_guardian-*.whl 2>/dev/null | xargs basename 2>/dev/null || true)
          if [[ -n "$WHL" ]]; then
            echo "version=$WHL" >> "$GITHUB_OUTPUT"
          else
            # No wheel in vendor/ — install from PyPI using the image tag as version
            echo "version=${{ steps.params.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # --- Multi-arch build setup ---
      - name: Set up QEMU
        if: steps.params.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.params.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to quay.io
        if: steps.params.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_RPS_USERNAME }}
          password: ${{ secrets.QUAY_RPS_PASSWORD }}

      # --- Skip rebuild if commit-tagged image already exists ---
      - name: Check if image exists
        if: steps.params.outputs.skip != 'true'
        id: check
        run: |
          docker manifest inspect quay.io/redhatproductsecurity/ai-guardian:${{ github.sha }} > /dev/null 2>&1 \
            && echo "exists=true" >> "$GITHUB_OUTPUT" \
            || echo "exists=false" >> "$GITHUB_OUTPUT"

      # --- Build and push image ---
      # Named tag: :latest / :<version> / custom (permanent)
      - name: Build and push image
        if: steps.params.outputs.skip != 'true' && steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: container/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/redhatproductsecurity/ai-guardian:${{ steps.params.outputs.image_tag }}
          build-args: |
            AI_GUARDIAN_VERSION=${{ steps.wheel.outputs.version }}

      # SHA tag: ephemeral commit-tagged image for CI/scenario tests (#1895)
      - name: Push SHA-tagged image
        if: steps.params.outputs.skip != 'true' && steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: container/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/redhatproductsecurity/ai-guardian:${{ github.sha }}
          build-args: |
            AI_GUARDIAN_VERSION=${{ steps.wheel.outputs.version }}

      # Set 24h expiration via Quay API — OCI labels have no effect (#2122)
      - name: Set SHA tag expiration (24h)
        if: steps.params.outputs.skip != 'true' && steps.check.outputs.exists != 'true'
        run: |
          EXPIRY=$(date -u -d '+24 hours' +%s 2>/dev/null || date -u -v+24H +%s)
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.QUAY_RPS_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "{\"expiration\": ${EXPIRY}}" \
            "https://quay.io/api/v1/repository/redhatproductsecurity/ai-guardian/tag/${{ github.sha }}"

      # --- Legacy mirror outputs for downstream jobs ---
      - name: Export image tag
        if: steps.params.outputs.skip != 'true'
        id: export
        run: echo "image_tag=${{ steps.params.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

    outputs:
      image_tag: ${{ steps.export.outputs.image_tag }}
      skip: ${{ steps.params.outputs.skip }}

  # --- Legacy mirror to itdove (transition period — remove in v2.0, see #1774) ---
  # Callers pass skip_legacy_mirror: true when they run their own mirror job.
  legacy-mirror:
    name: Legacy Mirror (itdove)
    needs: build-and-push
    if: needs.build-and-push.outputs.skip != 'true' && !inputs.skip_legacy_mirror
    runs-on: ubuntu-latest
    steps:
      - name: Copy to itdove legacy registry
        env:
          SRC_CREDS: ${{ secrets.QUAY_RPS_USERNAME }}:${{ secrets.QUAY_RPS_PASSWORD }}
          DEST_CREDS: ${{ secrets.QUAY_USERNAME }}:${{ secrets.QUAY_PASSWORD }}
        run: |
          for TAG in "${{ needs.build-and-push.outputs.image_tag }}" "${{ github.sha }}"; do
            skopeo copy --all \
              --src-creds "$SRC_CREDS" \
              --dest-creds "$DEST_CREDS" \
              "docker://quay.io/redhatproductsecurity/ai-guardian:${TAG}" \
              "docker://quay.io/itdove/ai-guardian:${TAG}"
          done

      # Set 24h expiration on SHA tag in legacy mirror (#2122)
      - name: Set legacy SHA tag expiration (24h)
        run: |
          EXPIRY=$(date -u -d '+24 hours' +%s 2>/dev/null || date -u -v+24H +%s)
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.QUAY_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "{\"expiration\": ${EXPIRY}}" \
            "https://quay.io/api/v1/repository/itdove/ai-guardian/tag/${{ github.sha }}"
