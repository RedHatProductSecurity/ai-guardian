name: Bifrost Middleware

on:
  pull_request:
    paths:
      - "go/bifrost-middleware/**"
      - "docs/BIFROST_MIDDLEWARE_ARCHITECTURE.md"
      - ".github/workflows/bifrost-middleware.yml"
  push:
    paths:
      - "go/bifrost-middleware/**"
      - "docs/BIFROST_MIDDLEWARE_ARCHITECTURE.md"
      - ".github/workflows/bifrost-middleware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  BIFROST_VERSION: "2.6.0"
  BIFROST_REVISION: "172617bb045c6f43d697843c115e64f0155ed143"
  MODULE_DIR: "go/bifrost-middleware"

jobs:
  metadata:
    name: Validate compatibility metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate pinned metadata
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("compatibility.json").read_text())
          assert metadata["bifrost"]["version"] == os.environ["BIFROST_VERSION"]
          assert metadata["bifrost"]["revision"] == os.environ["BIFROST_REVISION"]
          assert metadata["toolchain"]["go"] == os.environ["GO_VERSION"]
          assert metadata["bifrost"]["build_mode"] == "dynamic-plugin"
          assert not any(item["os"] == "windows" for item in metadata["platforms"])
          PY

      - name: Check module declaration
        run: grep -Fq 'go 1.27.4' "${MODULE_DIR}/go.mod"

  build:
    name: Build plugin (${{ matrix.goarch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            artifact: ai-guardian-bifrost-v2.6.0-go1.27.4-linux-amd64.so
          - goarch: arm64
            runner: ubuntu-24.04-arm
            artifact: ai-guardian-bifrost-v2.6.0-go1.27.4-linux-arm64.so
    steps:
      - uses: actions/checkout@v5

      - name: Check out pinned Bifrost source
        uses: actions/checkout@v5
        with:
          repository: maximhq/bifrost
          ref: ${{ env.BIFROST_REVISION }}
          path: .bifrost
          fetch-depth: 1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ env.MODULE_DIR }}/go.sum

      - name: Verify toolchain
        run: test "$(go version | awk '{print $3}')" = "go${GO_VERSION}"

      - name: Verify Bifrost revision metadata
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          test "$(python -c 'import json; print(json.load(open("compatibility.json"))["bifrost"]["revision"])')" = "${BIFROST_REVISION}"
          test "$(python -c 'import json; print(json.load(open("compatibility.json"))["bifrost"]["version"])')" = "${BIFROST_VERSION}"
          grep -Fq "go ${GO_VERSION}" "${GITHUB_WORKSPACE}/.bifrost/core/go.mod"

      - name: Create shared Bifrost workspace
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".bifrost"
          modules = sorted(path.parent for path in root.rglob("go.mod"))
          modules.append(Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["MODULE_DIR"])
          workspace = Path(os.environ["RUNNER_TEMP"]) / "bifrost-ai-guardian.work"
          lines = [f"go {os.environ['GO_VERSION']}", "", "use ("]
          lines.extend(f"\t{path}" for path in modules)
          lines.append(")")
          workspace.write_text("\n".join(lines) + "\n")
          print(workspace)
          PY

      - name: Verify module graph is unchanged
        working-directory: ${{ env.MODULE_DIR }}
        env:
          GOWORK: ${{ runner.temp }}/bifrost-ai-guardian.work
        run: |
          git diff --exit-code -- go.mod go.sum

      - name: Test plugin module
        working-directory: ${{ env.MODULE_DIR }}
        env:
          GOWORK: ${{ runner.temp }}/bifrost-ai-guardian.work
        run: go test -mod=readonly ./...

      - name: Build shared object
        working-directory: ${{ env.MODULE_DIR }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          GOWORK: ${{ runner.temp }}/bifrost-ai-guardian.work
        run: |
          mkdir -p dist
          go build -mod=readonly -trimpath -buildmode=plugin -o "dist/${{ matrix.artifact }}" .
          file "dist/${{ matrix.artifact }}"
          sha256sum "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256"

      - name: Build and run plugin load smoke test
        env:
          GOWORK: ${{ runner.temp }}/bifrost-ai-guardian.work
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          loader_dir="${RUNNER_TEMP}/bifrost-plugin-loader"
          mkdir -p "$loader_dir"
          cat > "$loader_dir/go.mod" <<EOF
          module bifrost-plugin-loader

          go ${GO_VERSION}

          require github.com/maximhq/bifrost/core v1.16.0
          EOF
          cat > "$loader_dir/main.go" <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "plugin"

              _ "github.com/maximhq/bifrost/core/schemas"
          )

          func main() {
              if len(os.Args) != 2 {
                  panic("usage: plugin-loader plugin.so")
              }
              if _, err := plugin.Open(os.Args[1]); err != nil {
                  panic(err)
              }
              fmt.Println("plugin load successful")
          }
          EOF
          go work use "$loader_dir"
          go build -mod=readonly -o "$loader_dir/plugin-loader" "$loader_dir"
          "$loader_dir/plugin-loader" "${MODULE_DIR}/dist/${{ matrix.artifact }}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-guardian-bifrost-v${{ env.BIFROST_VERSION }}-go${{ env.GO_VERSION }}-linux-${{ matrix.goarch }}
          path: ${{ env.MODULE_DIR }}/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ai-guardian-bifrost-v${{ env.BIFROST_VERSION }}-go${{ env.GO_VERSION }}-linux-*
          path: release-assets
          merge-multiple: true

      - name: Create combined checksums
        working-directory: release-assets
        run: sha256sum *.so > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.so
            release-assets/*.sha256
            release-assets/checksums.txt
