[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-guardian"
version = "1.20.0-dev"
description = "AI IDE security hook: blocks directories, scans secrets, and protects AI interactions"
authors = [{name = "itdove team"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0.0",
  "requests>=2.28.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "pyyaml>=6.0.0",
  "tree-sitter>=0.25.0",
  "tree-sitter-json>=0.24.0",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-ruby>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-bash>=0.23",
  "pystray>=0.19.0",
  "Pillow>=9.0.0",
  "docker>=7.0,<9",
  "mcp>=2.0.0",
  "rapidocr==3.9.2",
  # pip may evaluate every marker branch, including on Linux. Linux kernel
  # releases such as 6.17.0-1022-azure are not PEP 440 versions, so use
  # string checks for the Darwin wheel gates rather than numeric comparisons
  # on platform_release. Darwin 16-21 (macOS 10.12-12) have no compatible
  # wheels; Darwin 22 (macOS 13) is the ARM split between the two pins.
  "onnxruntime==1.23.2; python_version >= '3.10' and python_version < '3.11' and (sys_platform != 'darwin' or ('16.' not in platform_release and '17.' not in platform_release and '18.' not in platform_release and '19.' not in platform_release and '20.' not in platform_release and '21.' not in platform_release))",
  "onnxruntime==1.23.2; python_version >= '3.11' and python_version < '3.14' and sys_platform == 'darwin' and ('16.' not in platform_release and '17.' not in platform_release and '18.' not in platform_release and '19.' not in platform_release and '20.' not in platform_release and '21.' not in platform_release) and (platform_machine != 'arm64' or '22.' in platform_release)",
  "onnxruntime==1.29.0; python_version >= '3.11' and (sys_platform != 'darwin' or (platform_machine == 'arm64' and '16.' not in platform_release and '17.' not in platform_release and '18.' not in platform_release and '19.' not in platform_release and '20.' not in platform_release and '21.' not in platform_release and '22.' not in platform_release))",
  "nicegui>=3.0.4",
  "tokenizers>=0.15.0",
  "boto3>=1.28.0",
  "bandit>=1.7.0",
]
keywords = ["ai", "security", "claude", "cursor", "secrets", "gitleaks", "hooks"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
tray-linux = [
  "PyGObject>=3.42.0",
]
tray-k8s = [
  "kubernetes>=28.0",
]
ml = []
anthropic = [
  "anthropic>=0.30.0",
]
openai = [
  "openai>=1.0.0",
]
all-providers = [
  "anthropic>=0.30.0",
  "openai>=1.0.0",
]
middleware = [
  # Apache-2.0 gRPC transport plus MIT JWT validation for OpenShell extensions.
  "grpcio>=1.84,<2",
  "protobuf>=7.35.1,<8",
  "PyJWT>=2.8.0",
]
otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "mypy>=1.18,<3",
  "types-PyYAML>=6.0.12",
]

[project.urls]
"Homepage" = "https://github.com/RedHatProductSecurity/ai-guardian"
"Bug Tracker" = "https://github.com/RedHatProductSecurity/ai-guardian/issues"
"Source Code" = "https://github.com/RedHatProductSecurity/ai-guardian"

[project.scripts]
ai-guardian = "ai_guardian_hook_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_guardian"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_guardian_hook_runtime.py" = "ai_guardian_hook_runtime.py"
"images" = "ai_guardian/images"
"README.md" = "ai_guardian/README.md"
"pyproject.toml" = "ai_guardian/pyproject.toml"
# The sandbox command composes the same OpenShell baseline and agent policies
# used by the container image. Keep them in installed wheels so the command
# works outside a source checkout as well.
"container/policies" = "ai_guardian/sandbox_assets/policies"
"container/openshell-github-readonly-policy.yaml" = "ai_guardian/sandbox_assets/openshell-github-readonly-policy.yaml"
"container/openshell-github-readwrite-policy.yaml" = "ai_guardian/sandbox_assets/openshell-github-readwrite-policy.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "hermes: Hermes Security Framework validation tests",
    "benchmark: Performance benchmark tests",
    "timeout: per-test timeout override used by pytest-timeout",
]

[tool.coverage.run]
source = ["src/ai_guardian"]
omit = [
    # Console modules (separate from core security logic)
    "src/ai_guardian/ui/*",
    "src/ai_guardian/web/*",

    # Infrastructure/setup modules
    "src/ai_guardian/__main__.py",
    "src/ai_guardian/scanner.py",
    "src/ai_guardian/setup.py",

    # Config management (tested via integration tests)
    "src/ai_guardian/config_inspector.py",
    "src/ai_guardian/config_manager.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
precision = 0
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E402",   # module-level import not at top — used extensively for conditional/lazy imports
  "E501",   # line too long — handled by black; URLs and long strings can't be wrapped
  "E731",   # lambda assignment — used in test fixtures and callbacks
  "E741",   # ambiguous variable name (l, O, I) — too many false positives
  "F401",   # unused import — many re-exports and conditional imports
  "F811",   # redefined unused — test fixtures shadow intentionally
  "F841",   # local variable assigned but never used — common in tests (result = func())
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F821"]
"src/ai_guardian/hook_processing.py" = ["F821"]
"src/ai_guardian/cli_handlers.py" = ["F821"]
"src/ai_guardian/setup.py" = ["F821"]

[tool.mypy]
# Run Mypy in strict mode on the CI runtime. Runtime compatibility with Python
# 3.10 remains covered by the test matrix; this avoids parsing newer
# third-party stubs with syntax unavailable to older Mypy targets.
strict = true
exclude = "^src/ai_guardian/middleware/proto/"
python_version = "3.12"

# The codebase predates strict typing and still contains deliberately dynamic
# JSON, CLI, and UI boundaries. Keep strict body checking and soundness checks
# enabled while those boundaries are migrated incrementally. These exceptions
# are intentionally explicit rather than using per-file ignores, so new type
# errors in annotated code continue to fail CI.
check_untyped_defs = true
warn_unreachable = true
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
no_implicit_reexport = false
warn_return_any = false
implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

# Several integrations are optional or platform-specific and do not publish
# usable stubs for every supported environment. Ignore only import metadata;
# all errors in ai_guardian source remain enforced.
ignore_missing_imports = true
follow_imports = "skip"

# These modules are legacy UI integration boundaries with intentionally dynamic
# callback and widget objects. Annotated functions still use strict checking;
# untyped function bodies remain a staged migration area rather than being
# hidden with per-line ignores.
[[tool.mypy.overrides]]
module = [
  "ai_guardian.ui.*",
  "ai_guardian.web.*",
  "ai_guardian.tray.*",
]
check_untyped_defs = false

[tool.ai-guardian.scanners]
# Pinned versions used by `scanner install --use-pinned` and container builds.
# Release assets are checked by scripts/check_scanner_versions.py.
gitleaks = "8.30.1"
betterleaks = "1.3.1"
leaktk = "0.3.4"
trufflehog = "3.88.0"
detect-secrets = "1.5.0"
secretlint = "13.0.5"
gitguardian = "1.54.0"

[tool.ai-guardian.scanners.repos]
gitleaks = "gitleaks/gitleaks"
betterleaks = "betterleaks/betterleaks"
leaktk = "leaktk/leaktk"
trufflehog = "trufflesecurity/trufflehog"
detect-secrets = "Yelp/detect-secrets"
secretlint = "secretlint/secretlint"
gitguardian = "GitGuardian/ggshield"

[tool.ai-guardian.scanners.pattern_servers]
leaktk = { url = "https://raw.githubusercontent.com", patterns_endpoint = "/leaktk/patterns/main/target/patterns/gitleaks/8.27.0" }
