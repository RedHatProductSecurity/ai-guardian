# Shared static baseline for the AI Guardian OpenShell support image.
# Network capabilities are supplied by separate policy fragments.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort
