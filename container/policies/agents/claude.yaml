# Claude Code network capability.
# The managed sandbox command adds a credential-bound Vertex policy when
# Claude Code uses the gateway-owned google-cloud ADC provider.
version: 1

network_policies:
  claude_code:
    name: claude-code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: sentry.io
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: platform.claude.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: claude.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: claude.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: downloads.claude.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /sandbox/.local/bin/claude }
      # The native launcher resolves to its versioned binary under this directory.
      - { path: /sandbox/.local/share/claude/versions/** }
  claude_install:
    name: claude-install
    endpoints:
      - host: claude.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: downloads.claude.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - { path: /usr/bin/curl }
      # The native installer fetches release metadata from this versioned temp binary.
      - { path: /sandbox/.claude/downloads/claude-* }
