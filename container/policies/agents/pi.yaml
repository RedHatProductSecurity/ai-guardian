# Pi uses native Anthropic or OpenAI endpoints. OpenShell provider-backed
# credentials are attached to the selected sandbox and resolved at their
# provider-authorized endpoints. OpenAI and Codex OAuth routes are experimental.
version: 1

network_policies:
  anthropic:
    name: anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/pi }
      - { path: /usr/local/bin/pi }
      - { path: /usr/lib/node_modules/@earendil-works/pi-coding-agent/** }
  openai:
    name: openai
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: auth.openai.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: ab.chatgpt.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/pi }
      - { path: /usr/local/bin/pi }
      - { path: /usr/lib/node_modules/@earendil-works/pi-coding-agent/** }
