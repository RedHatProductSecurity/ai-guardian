# Read-only GitHub capability for the AI Guardian OpenShell support image.
#
# This is the main policy overlay. The OpenShell launcher composes it with
# policies/base.yaml and the selected agent fragment from policies/agents/.
# Credentials are supplied separately by OpenShell providers.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  github_api_readonly:
    name: github-api-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/curl }

  github_git_readonly:
    name: github-git-readonly
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/git }
